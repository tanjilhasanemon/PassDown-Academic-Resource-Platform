name: PassDown CI Pipeline

on:
  push:
    branches: [ "main", "develop", "feat/**", "docs/**" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-lint-test-and-docs:
    name: Backend Code Review (Ruff & Bandit), Unit Tests (Pytest) & Sphinx Docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run PEP 8 & Bugbear Code Review with Ruff
        run: |
          python -m ruff check --select E9,F .

      - name: Run Security Static Analysis with Bandit
        run: |
          python -m bandit -r api core dependencies models repositories schemas services main.py -ll

      - name: Run Pytest Unit, Integration & 100% Docstring Coverage Suite
        env:
          PYTHONPATH: "."
          DATABASE_URL: "sqlite:///./test_ci.db"
          JWT_SECRET: "ci-test-secret-key-minimum-32-characters-2026"
          CORS_ORIGINS: "http://localhost:5173"
        run: python -m pytest -v --cov=. --cov-report=term-missing --cov-report=html

      - name: Build Sphinx HTML Source Code Documentation
        env:
          PYTHONPATH: "."
        run: |
          sphinx-build -b html ../docs/source ../docs/build/html

  frontend-typecheck-and-build:
    name: Frontend TypeScript Check & Production Vite Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Frontend Dependencies
        run: npm install

      - name: Run Strict TypeScript Check & Vite Production Build
        run: npm run build
