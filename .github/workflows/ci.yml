name: PassDown CI Pipeline

on:
  push:
    branches: [ "main", "develop", "feat/**", "docs/**" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-lint-test-and-docs:
    name: Backend Lint (Ruff), Unit Tests (Pytest) & Sphinx Docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn sqlalchemy "pydantic[email]" pydantic-settings "passlib[bcrypt]" PyJWT python-multipart pytest pytest-cov httpx ruff sphinx sphinx-rtd-theme

      - name: Run PEP 8 Coding Standard check with Ruff
        run: python -m ruff check .

      - name: Run Pytest Unit, Integration & 100% Docstring Coverage Suite
        env:
          PYTHONPATH: "."
          DATABASE_URL: "sqlite:///./test.db"
          JWT_SECRET: "ci-test-secret-key-do-not-use-in-prod"
          CORS_ORIGINS: "http://localhost:5173"
        run: python -m pytest --cov=app --cov-report=term-missing

      - name: Build Sphinx HTML Source Code Documentation (SL# 7)
        env:
          PYTHONPATH: "."
        run: sphinx-build -b html ../docs/source ../docs/build/html

  frontend-typecheck-and-build:
    name: Frontend TypeScript Check, Vite Build & TypeDoc (SL# 7 & SL# 10)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies
        run: npm install

      - name: Run Strict TypeScript Compiler Check
        run: npm run typecheck

      - name: Build Production React + Vite Bundle
        run: npm run build

      - name: Generate TypeDoc/JSDoc HTML Documentation
        run: npm run docs
