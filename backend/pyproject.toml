[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = [
    "B008",  # FastAPI Depends() and Security() in function defaults
    "E501",  # Handled by formatting guidelines for long URLs/docstrings
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
